<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Weather</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            transition: background 1s ease;
            color: white;
            overflow-x: hidden;
        }

        /* Weather-based backgrounds */
        body.sunny { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        body.cloudy { background: linear-gradient(135deg, #4b6cb7, #182848); }
        body.rainy { background: linear-gradient(135deg, #373b44, #4286f4); }
        body.snowy { background: linear-gradient(135deg, #83a4d4, #b6fbff); }
        body.stormy { background: linear-gradient(135deg, #232526, #414345); }
        body.night { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
        body.default { background: linear-gradient(135deg, #667eea, #764ba2); }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 20px 0 30px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        /* Location bar */
        .location-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .location-bar input {
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            width: 260px;
            background: rgba(255,255,255,0.2);
            color: white;
            backdrop-filter: blur(10px);
            outline: none;
        }

        .location-bar input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .location-bar button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            background: rgba(255,255,255,0.25);
            color: white;
            backdrop-filter: blur(10px);
            transition: background 0.3s;
        }

        .location-bar button:hover {
            background: rgba(255,255,255,0.4);
        }

        /* Loading & error */
        .message {
            text-align: center;
            font-size: 1.1rem;
            padding: 40px 20px;
            opacity: 0.9;
        }

        .error {
            color: #ff6b6b;
        }

        /* Current weather hero card */
        .current-weather {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .current-weather .city {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .current-weather .date {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .current-weather .icon {
            font-size: 4rem;
            margin: 10px 0;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        .current-weather .temp {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 2px 15px rgba(0,0,0,0.15);
        }

        .current-weather .unit-toggle {
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.6;
            margin-left: 5px;
            transition: opacity 0.3s;
        }

        .current-weather .unit-toggle:hover {
            opacity: 1;
        }

        .current-weather .details {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .current-weather .detail-item {
            text-align: center;
        }

        .current-weather .detail-label {
            font-size: 0.8rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .current-weather .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 3px;
        }

        /* 7-day forecast */
        .forecast-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .forecast-row {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.3) transparent;
        }

        .forecast-row::-webkit-scrollbar {
            height: 6px;
        }

        .forecast-row::-webkit-scrollbar-track {
            background: transparent;
        }

        .forecast-row::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }

        .forecast-card {
            flex: 0 0 110px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .forecast-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .forecast-card .day {
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .forecast-card .icon {
            font-size: 2rem;
            margin: 8px 0;
        }

        .forecast-card .temps {
            font-size: 1rem;
            font-weight: 700;
        }

        .forecast-card .temps .low {
            opacity: 0.5;
            font-weight: 400;
            margin-left: 4px;
        }

        .forecast-card .desc {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 6px;
            line-height: 1.3;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0 15px;
            font-size: 0.8rem;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 15px; }
            header h1 { font-size: 1.4rem; }
            .current-weather { padding: 20px; }
            .current-weather .temp { font-size: 3rem; }
            .current-weather .icon { font-size: 3rem; }
            .current-weather .details { gap: 15px; }
            .forecast-card { flex: 0 0 95px; padding: 14px 8px; }
        }
    </style>
</head>
<body class="default">
    <div class="container">
        <header>
            <h1>🌤 Local Weather</h1>
        </header>

        <div class="location-bar">
            <input type="text" id="searchInput" placeholder="Search city or zip code..." />
            <button id="searchBtn">Search</button>
            <button id="geoBtn">📍 Use My Location</button>
        </div>

        <div id="output">
            <p class="message">Allow location access or search for a city to see the forecast.</p>
        </div>

        <footer>
            Powered by Open-Meteo & Nominatim (free, no API key)
        </footer>
    </div>

    <script>
        // State
        let useCelsius = true;
        let currentLat = null;
        let currentLon = null;
        let currentCity = '';

        // DOM refs
        const output = document.getElementById('output');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const geoBtn = document.getElementById('geoBtn');

        // Weather code to icon mapping (WMO codes)
        const weatherIcons = {
            0: '☀️', 1: '🌤', 2: '⛅', 3: '☁️',
            45: '🌫', 48: '🌫',
            51: '🌦', 53: '🌧', 55: '🌧',
            56: '🌧', 57: '🌧',
            61: '🌦', 63: '🌧', 65: '🌧',
            66: '🌧', 67: '🌧',
            71: '🌨', 73: '❄️', 75: '❄️',
            77: '🌨',
            80: '🌦', 81: '🌧', 82: '🌧',
            85: '🌨', 86: '❄️',
            95: '⛈', 96: '⛈', 99: '⛈'
        };

        const weatherDescriptions = {
            0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
            45: 'Foggy', 48: 'Rime fog',
            51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle',
            56: 'Freezing drizzle', 57: 'Heavy freezing drizzle',
            61: 'Light rain', 63: 'Rain', 65: 'Heavy rain',
            66: 'Light freezing rain', 67: 'Heavy freezing rain',
            71: 'Light snow', 73: 'Snow', 75: 'Heavy snow',
            77: 'Snow grains',
            80: 'Light showers', 81: 'Showers', 82: 'Heavy showers',
            85: 'Light snow showers', 86: 'Heavy snow showers',
            95: 'Thunderstorm', 96: 'Thunderstorm w/ hail', 99: 'Severe thunderstorm'
        };

        // Day name helper
        function getDayName(dateStr) {
            const d = new Date(dateStr + 'T12:00:00');
            return d.toLocaleDateString('en-US', { weekday: 'short' });
        }

        // Format date
        function formatDate() {
            return new Date().toLocaleDateString('en-US', {
                weekday: 'long', month: 'long', day: 'numeric'
            });
        }

        // Convert temp
        function tempF(c) {
            return Math.round(c * 9 / 5 + 32);
        }

        function displayTemp(c) {
            return useCelsius ? Math.round(c) + '°C' : tempF(c) + '°F';
        }

        function displayLow(c) {
            return useCelsius ? Math.round(c) + '°' : tempF(c) + '°';
        }

        // Wind speed unit
        function displayWind(kmh) {
            return useCelsius ? Math.round(kmh) + ' km/h' : Math.round(kmh * 0.621371) + ' mph';
        }

        // Set background based on weather
        function setBackground(code, isDay) {
            const body = document.body;
            body.className = 'default';

            if (!isDay) { body.classList.add('night'); return; }

            if (code === 0 || code === 1) body.classList.add('sunny');
            else if (code >= 2 && code <= 3) body.classList.add('cloudy');
            else if (code >= 45 && code <= 48) body.classList.add('cloudy');
            else if (code >= 51 && code <= 67) body.classList.add('rainy');
            else if (code >= 71 && code <= 86) body.classList.add('snowy');
            else if (code >= 95) body.classList.add('stormy');
            else body.classList.add('default');
        }

        // Render current weather
        function renderCurrent(data, city) {
            const now = data.current;
            const code = now.weather_code;
            const isDay = now.is_day;
            const tempC = now.temperature_2m;

            setBackground(code, isDay);

            return `
                <div class="current-weather">
                    <div class="city">${city}</div>
                    <div class="date">${formatDate()}</div>
                    <div class="icon">${weatherIcons[code] || '🌡️'}</div>
                    <div class="temp">
                        ${displayTemp(tempC)}
                        <span class="unit-toggle" id="unitToggle" title="Toggle °C/°F">(${useCelsius ? '°F' : '°C'})</span>
                    </div>
                    <div class="details">
                        <div class="detail-item">
                            <div class="detail-label">Feels Like</div>
                            <div class="detail-value">${displayTemp(data.current.apparent_temperature)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Humidity</div>
                            <div class="detail-value">${data.current.relative_humidity_2m}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Wind</div>
                            <div class="detail-value">${displayWind(data.current.wind_speed_10m)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">UV Index</div>
                            <div class="detail-value">${data.current.uvi_display ? Math.round(data.current.uvi_display) : '—'}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render 7-day forecast
        function renderForecast(data) {
            const daily = data.daily;
            let cards = '';

            for (let i = 0; i < 7; i++) {
                const date = daily.time[i];
                const code = daily.weather_code[i];
                const highC = daily.temperature_2m_max[i];
                const lowC = daily.temperature_2m_min[i];

                cards += `
                    <div class="forecast-card">
                        <div class="day">${getDayName(date)}</div>
                        <div class="icon">${weatherIcons[code] || '🌡️'}</div>
                        <div class="temps">
                            ${displayTemp(highC)}
                            <span class="low">${displayLow(lowC)}</span>
                        </div>
                        <div class="desc">${weatherDescriptions[code] || ''}</div>
                    </div>
                `;
            }

            return `
                <div class="forecast-title">7-Day Forecast</div>
                <div class="forecast-row">${cards}</div>
            `;
        }

        // Render full output
        function render(city, currentData, forecastData) {
            const html = renderCurrent(currentData, city) + renderForecast(forecastData);
            output.innerHTML = html;

            // Unit toggle
            document.getElementById('unitToggle').addEventListener('click', () => {
                useCelsius = !useCelsius;
                render(city, currentData, forecastData);
            });
        }

        // Search city name
        async function searchCity(query) {
            const res = await fetch(
                `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`
            );
            const results = await res.json();
            if (results.length === 0) throw new Error('Location not found');
            return { lat: parseFloat(results[0].lat), lon: parseFloat(results[0].lon), name: results[0].display_name.split(',')[0] };
        }

        // Fetch weather data
        async function fetchWeather(lat, lon) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
                + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,uvi_display`
                + `&daily=weather_code,temperature_2m_min,temperature_2m_max`
                + `&timezone=auto&forecast_days=7`;

            const res = await fetch(url);
            if (!res.ok) throw new Error('Failed to fetch weather data');
            return res.json();
        }

        // Main fetch
        async function loadWeather(lat, lon) {
            output.innerHTML = '<p class="message">Loading weather data...</p>';

            try {
                // Reverse geocode
                const geoRes = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`
                );
                const geo = await geoRes.json();
                const city = geo.address.city || geo.address.town || geo.address.village || geo.address.county || 'Your Location';

                // Fetch weather
                const forecast = await fetchWeather(lat, lon);
                const current = forecast.current;

                // Build current data object with timezone
                const currentData = {
                    ...current,
                    current: current
                };

                render(city, currentData, forecast);
            } catch (err) {
                output.innerHTML = `<p class="message error">Error: ${err.message}</p>`;
            }
        }

        // Geolocation handler
        geoBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                output.innerHTML = '<p class="message error">Geolocation is not supported by your browser.</p>';
                return;
            }

            geoBtn.textContent = '⏳ Getting location...';
            geoBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    loadWeather(currentLat, currentLon);
                    geoBtn.textContent = '📍 Use My Location';
                    geoBtn.disabled = false;
                },
                (err) => {
                    geoBtn.textContent = '📍 Use My Location';
                    geoBtn.disabled = false;
                    output.innerHTML = `<p class="message error">Location access denied. Please search for a city instead.</p>`;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });

        // Search handler
        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });

        async function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            output.innerHTML = '<p class="message">Searching...</p>';
            searchInput.disabled = true;
            searchBtn.disabled = true;

            try {
                const loc = await searchCity(query);
                currentLat = loc.lat;
                currentLon = loc.lon;
                await loadWeather(currentLat, currentLon);
            } catch (err) {
                output.innerHTML = `<p class="message error">${err.message}</p>`;
            } finally {
                searchInput.disabled = false;
                searchBtn.disabled = false;
            }
        }

        // Auto-detect on load
        window.addEventListener('load', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLon = pos.coords.longitude;
                        loadWeather(currentLat, currentLon);
                    },
                    () => {
                        // User denied — show search prompt (already the default)
                    },
                    { timeout: 5000 }
                );
            }
        });
    </script>
</body>
</html>
